// CI-only helper APK. Never linked to or bundled inside the game application.
apply plugin: 'com.android.application'
android {
    namespace 'com.elroybenjamins.cartcrown.uiprobe'
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.elroybenjamins.cartcrown.uiprobe'
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
