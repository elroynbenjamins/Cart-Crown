name: Import pending unique unit art

on:
  push:
    branches: [main]
    paths:
      - assets/cart_crown_pending_uniques_bundle.zip
      - .github/workflows/import-pending-uniques.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PNG optimizer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq optipng

      - name: Extract accepted unique unit art
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assets/cart_crown_pending_uniques_bundle.zip"
          test -f "$ZIP"

          rm -rf /tmp/cart-crown-pending-uniques
          mkdir -p /tmp/cart-crown-pending-uniques
          unzip -q "$ZIP" -d /tmp/cart-crown-pending-uniques

          ROOT="$(find /tmp/cart-crown-pending-uniques -type d -path '*/assets/units' | head -1)"
          test -n "$ROOT"

          for faction in human_uniques elf_uniques orc_uniques; do
            SRC="$ROOT/$faction"
            DST="assets/units/$faction"
            test -d "$SRC"
            mkdir -p "$DST"
            cp "$SRC"/*.png "$DST"/
            for f in "$DST"/*.png; do
              optipng -quiet -o4 -strip all "$f"
            done
          done

          rm -f "$ZIP"

      - name: Validate dimensions and transparency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              "human_uniques": 5,
              "elf_uniques": 5,
              "orc_uniques": 6,
          }

          for folder, count in expected.items():
              files = sorted(Path("assets/units", folder).glob("*.png"))
              assert len(files) == count, (folder, len(files), count)
              for path in files:
                  im = Image.open(path)
                  assert im.size == (256, 256), (path, im.size)
                  assert im.mode in ("RGBA", "LA") or "transparency" in im.info, (path, im.mode)
          PY

      - name: Report runtime size
        shell: bash
        run: |
          du -h assets/units/{human_uniques,elf_uniques,orc_uniques}/*.png | sort -h
          echo "Combined unique runtime total:"
          du -ch assets/units/{human_uniques,elf_uniques,orc_uniques}/*.png | tail -1

      - name: Commit imported art
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Import accepted Human Elf and Orc unique art"
          git push
