name: Revert duplicate production copies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revert-generated-production-copy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert duplicate production copy commit
        shell: bash
        run: |
          set -euo pipefail
          if git log --format=%H -n 50 | grep -qx "56022899c268e737b7264fcf616ded421bff9eb3"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git revert --no-edit 56022899c268e737b7264fcf616ded421bff9eb3
            git push
          else
            echo "Promotion commit is not in recent history; nothing to revert."
          fi
