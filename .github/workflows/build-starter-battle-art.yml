name: Build starter battle art

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-starter-battle-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build distinct Recruit and Militia battle assets
        shell: bash
        run: |
          set -euo pipefail
          command -v convert >/dev/null

          mkdir -p assets/game/battle_portraits/human

          make_asset() {
            src="$1"
            geometry="$2"
            dst="$3"
            convert "$src"               -crop "$geometry" +repage               -trim +repage               -resize '232x232>'               -background none               -gravity center               -extent 256x256               PNG32:"$dst"
          }

          make_asset assets/units/human/human_recruit_sheet.png             561x701+0+0             assets/game/battle_portraits/human/recruit_unit.png
          make_asset assets/units/human/human_recruit_sheet.png             335x332+751+879             assets/game/battle_portraits/human/recruit_portrait.png

          make_asset assets/units/human/human_militia_sheet.png             561x701+0+0             assets/game/battle_portraits/human/militia_unit.png
          make_asset assets/units/human/human_militia_sheet.png             355x355+731+921             assets/game/battle_portraits/human/militia_portrait.png

          identify assets/game/battle_portraits/human/{recruit,militia}_{unit,portrait}.png

      - name: Commit starter battle art
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/game/battle_portraits/human; then
            echo "No starter battle art changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game/battle_portraits/human
          git commit -m "Add distinct Recruit and Militia battle art"
          git push
