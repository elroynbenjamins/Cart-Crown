name: Human art verified transfer (temporary)
on:
  push:
    branches: ['art/human-portraits-v1']
    paths: ['.github/workflows/human-art-transfer-once.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'elroynbenjamins/Cart-Crown' && github.ref == 'refs/heads/art/human-portraits-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/human-portraits-v1
      - name: Verify and import reviewed PNGs and source files
        env:
          BUNDLE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e7d4-8210-8702-4d191663f4ae/raw?se=2026-09-30T19%3A12%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=812a922e-bee4-5689-9dda-543f918bbdcd&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T18%3A39%3A39Z&ske=2026-10-01T18%3A39%3A39Z&sks=b&skv=2026-02-06&sig=2ZxcBi8%2BFaxlVgCR3ZP6HQLJkgrGyCnd6R0fbazIPIs%3D'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          request = urllib.request.Request(os.environ['BUNDLE_URL'], headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/zip,application/octet-stream,*/*'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(3000001)
          assert len(data) == 2174376
          assert hashlib.sha256(data).hexdigest() == '8882a53a6e8f61005d0e590708ea222b0882cd2e1c33888690ee7d719b281729'
          z = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(z.read('manifest.json'))
          assert len(manifest) == 34 and set(z.namelist()) == set(manifest) | {'manifest.json'}
          allowed = {'src/ui/productionAssets.ts', 'scripts/art-regression.mjs', 'scripts/portrait-battle-regression.ts', 'scripts/human-art-payload-regression.mjs', 'scripts/human-battle-art-regression.ts', 'docs/human-battle-art-v1.md'}
          pending = {}
          for name, spec in manifest.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in allowed or name.startswith(('src/ui/portraitBattle/', 'assets/game/battle_portraits/human_v1/', 'assets/game/units/human/'))
              payload = z.read(name)
              assert len(payload) == spec['bytes'] and hashlib.sha256(payload).hexdigest() == spec['sha256'], name
              target = Path(name)
              if target.exists():
                  previous = target.read_bytes()
                  assert previous == payload or hashlib.sha256(previous).hexdigest() == spec['before_sha256'], 'Concurrent edit: ' + name
              else:
                  assert spec['before_sha256'] is None, 'Expected source missing: ' + name
              pending[name] = payload
          for name, payload in pending.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
          subprocess.run(['node', 'scripts/art-regression.mjs'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *pending.keys()], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Implement 12 generated Human portrait and battlefield class sets'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:art/human-portraits-v1'], check=True)
          Path('/tmp/human-art-transfer-proof.json').write_text(json.dumps({'bundle_sha256': hashlib.sha256(data).hexdigest(), 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'files': manifest}, indent=2))
          print('Verified and committed all 34 files; no workflow files imported and no force push.')
          PY
      - name: Retain transfer verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-art-transfer-proof
          path: /tmp/human-art-transfer-proof.json
          retention-days: 3
