name: Verified Human art transfer (one shot)
on:
  push:
    branches: [art/human-portrait-sprite-integration]
    paths: [.github/workflows/human-art-transfer-once.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'elroynbenjamins/Cart-Crown'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/human-portrait-sprite-integration
      - name: Verify and publish exact source and PNG export bytes
        env:
          BUNDLE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9850-8210-9d83-86864fa07b5d/raw?se=2026-09-30T19%3A27%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=02b35b5b-acf2-50b3-a30c-c9666441410a&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T18%3A27%3A55Z&ske=2026-10-01T18%3A27%3A55Z&sks=b&skv=2026-02-06&sig=MmxeYKvrwDX29nVs6Hc1YYt%2BKt1ZnQcPFEuDBbsSpI0%3D'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['GITHUB_SHA'], 'Branch moved; stop rather than overwrite.'
          req = urllib.request.Request(os.environ['BUNDLE_URL'], headers={'User-Agent':'Mozilla/5.0', 'Accept':'application/zip,application/octet-stream,*/*'})
          data = urllib.request.urlopen(req, timeout=45).read(4000000)
          assert hashlib.sha256(data).hexdigest() == 'c0d8accf495cba1f3e88cd5c9e1bb53a66766875eb80c565dbd1a502e036aba0', 'Bundle hash mismatch'
          archive = zipfile.ZipFile(io.BytesIO(data))
          manifest = json.loads(archive.read('manifest.json'))
          assert len(manifest) == 34
          assert set(archive.namelist()) == set(manifest) | {'manifest.json'}
          allowed = {'src/ui/portraitBattle/humanArt.ts','src/ui/portraitBattle/model.ts','src/ui/portraitBattle/Art.tsx','src/ui/portraitBattle/PortraitBattleView.tsx','src/ui/gameArt.tsx','src/ui/productionAssets.ts','scripts/portrait-battle-regression.ts','scripts/human-art-regression.ts','docs/human-art-integration.md'}
          pending = {}
          for name, spec in manifest.items():
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith('assets/game/battle_portraits/human/')
              payload = archive.read(name)
              assert hashlib.sha256(payload).hexdigest() == spec['sha256'], name
              target = Path(name)
              assert not target.is_symlink()
              if target.exists():
                  assert hashlib.sha256(target.read_bytes()).hexdigest() == spec['before_sha256'], 'Concurrent change: ' + name
              else:
                  assert spec['before_sha256'] is None, 'Missing prior file: ' + name
              pending[name] = payload
          for name, payload in pending.items():
              target = Path(name); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(payload)
          subprocess.run(['node','scripts/art-regression.mjs'], check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','--',*sorted(pending)], check=True)
          subprocess.run(['git','commit','-m','Integrate 24 generated Human portraits and figures with exact class mapping'], check=True)
          subprocess.run(['git','push','origin','HEAD:art/human-portrait-sprite-integration'], check=True)
          Path('/tmp/human-art-import.json').write_text(json.dumps({'bundle_sha256':hashlib.sha256(data).hexdigest(),'files':manifest},indent=2))
          print('Published',len(pending),'verified files. No workflow files imported.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: human-art-transfer-proof
          path: /tmp/human-art-import.json
          retention-days: 3
