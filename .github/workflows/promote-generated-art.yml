name: Promote generated art

on:
  push:
    branches: [main]
    paths:
      - assets/ui/crests/**
      - assets/units/**
      - .github/workflows/promote-generated-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote generated assets into production paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/game/factions/{human,elf,orc}
          cp assets/ui/crests/human_crest.png assets/game/factions/human/crest.png
          cp assets/ui/crests/elf_crest.png assets/game/factions/elf/crest.png
          cp assets/ui/crests/orc_crest.png assets/game/factions/orc/crest.png

          mkdir -p assets/game/units/human assets/game/units/elf assets/game/units/orc

          copy_many() {
            src="$1"
            shift
            for dst in "$@"; do
              cp "$src" "$dst"
            done
          }

          copy_many assets/units/human/human_01_recruit_icon.png             assets/game/units/human/recruit.png
          copy_many assets/units/human/human_02_militia_icon.png             assets/game/units/human/militia.png
          copy_many assets/units/human/human_03_spearman_icon.png             assets/game/units/human/spearman.png             assets/game/units/human/pikeman.png             assets/game/units/human/shield_spearman.png
          copy_many assets/units/human/human_04_swordsman_icon.png             assets/game/units/human/swordsman.png             assets/game/units/human/greatswordsman.png             assets/game/units/human/champion.png
          copy_many assets/units/human/human_05_archer_icon.png             assets/game/units/human/archer.png             assets/game/units/human/longbowman.png             assets/game/units/human/marksman.png             assets/game/units/human/ranger.png             assets/game/units/human/border_ranger.png
          copy_many assets/units/human/human_06_crossbow_icon.png             assets/game/units/human/crossbowman.png             assets/game/units/human/siege_engineer.png
          copy_many assets/units/human/human_07_scout_icon.png             assets/game/units/human/scout.png
          copy_many assets/units/human/human_08_shield_guard_icon.png             assets/game/units/human/shield_infantry.png             assets/game/units/human/royal_guard.png
          copy_many assets/units/human/human_09_knight_icon.png             assets/game/units/human/scout_rider.png             assets/game/units/human/cavalryman.png             assets/game/units/human/lancer.png             assets/game/units/human/mounted_archer.png             assets/game/units/human/heavy_cavalry.png
          copy_many assets/units/human/human_10_halberdier_icon.png             assets/game/units/human/halberdier.png             assets/game/units/human/man_at_arms.png
          copy_many assets/units/human/human_11_cleric_icon.png             assets/game/units/human/field_medic.png             assets/game/units/human/field_chaplain.png
          copy_many assets/units/human/human_12_commander_icon.png             assets/game/units/human/banner_captain.png

          copy_many assets/units/elf/elf_01_icon.png             assets/game/units/elf/grove_acolyte.png
          copy_many assets/units/elf/elf_02_icon.png             assets/game/units/elf/spear_warden.png
          copy_many assets/units/elf/elf_03_icon.png             assets/game/units/elf/blade_warden.png
          copy_many assets/units/elf/elf_04_icon.png             assets/game/units/elf/bow_warden.png             assets/game/units/elf/moon_ranger.png
          copy_many assets/units/elf/elf_05_icon.png             assets/game/units/elf/pathfinder.png             assets/game/units/elf/forest_scout.png
          copy_many assets/units/elf/elf_06_icon.png             assets/game/units/elf/warden.png
          copy_many assets/units/elf/elf_07_icon.png             assets/game/units/elf/stag_scout.png             assets/game/units/elf/stag_rider.png
          copy_many assets/units/elf/elf_08_icon.png             assets/game/units/elf/druid.png             assets/game/units/elf/spiritkeeper.png
          copy_many assets/units/elf/elf_10_icon.png             assets/game/units/elf/mounted_ranger.png             assets/game/units/elf/stag_lancer.png

          copy_many assets/units/orc/orc_01_icon.png             assets/game/units/orc/clan_warrior.png             assets/game/units/orc/youngblood.png
          copy_many assets/units/orc/orc_03_icon.png             assets/game/units/orc/spear_raider.png             assets/game/units/orc/axe_thrower.png
          copy_many assets/units/orc/orc_04_icon.png             assets/game/units/orc/ironhide.png
          copy_many assets/units/orc/orc_06_icon.png             assets/game/units/orc/hunter.png             assets/game/units/orc/bone_hunter.png
          copy_many assets/units/orc/orc_07_icon.png             assets/game/units/orc/warg_scout.png             assets/game/units/orc/warg_rider.png             assets/game/units/orc/warg_raider.png             assets/game/units/orc/warg_lancer.png
          copy_many assets/units/orc/orc_08_icon.png             assets/game/units/orc/bone_shaman.png
          copy_many assets/units/orc/orc_10_icon.png             assets/game/units/orc/war_drummer.png
          copy_many assets/units/orc/orc_12_icon.png             assets/game/units/orc/warbringer.png

      - name: Commit production art
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/game; then
            echo "No production art changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game
          git commit -m "Promote generated crest and unit art"
          git push
