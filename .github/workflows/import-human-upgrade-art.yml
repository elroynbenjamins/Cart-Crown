name: Import human upgrade art

on:
  push:
    branches: [main]
    paths:
      - assets/cart_crown_human_upgrades_upload.zip
      - .github/workflows/import-human-upgrade-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick optipng

      - name: Extract and optimize upgrade art
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assets/cart_crown_human_upgrades_upload.zip"
          test -f "$ZIP"

          rm -rf /tmp/cart-crown-human-upgrades
          mkdir -p /tmp/cart-crown-human-upgrades
          unzip -q "$ZIP" -d /tmp/cart-crown-human-upgrades

          SRC="/tmp/cart-crown-human-upgrades/cart_crown_human_upgrades_upload/assets/units/human_upgrades"
          DST="assets/units/human_upgrades"
          test -d "$SRC"
          mkdir -p "$DST"

          for name in             longbowman marksman greatswordsman champion pikeman royal_guard             heavy_cavalry lancer mounted_archer field_medic field_chaplain             banner_captain siege_engineer
          do
            test -f "$SRC/$name.png"
            convert "$SRC/$name.png"               -trim +repage               -resize '232x232>'               -background none               -gravity center               -extent 256x256               PNG32:"$DST/$name.png"
            optipng -quiet -o4 -strip all "$DST/$name.png"
          done

          # Keep the original atlas only outside the runtime set for reference.
          cp "$SRC/human_upgrades_sheet.png" "$DST/human_upgrades_sheet.png"
          optipng -quiet -o2 -strip all "$DST/human_upgrades_sheet.png" || true

          rm -f "$ZIP"

      - name: Report asset sizes
        shell: bash
        run: |
          du -h assets/units/human_upgrades/*.png | sort -h
          echo "Runtime promoted-unit total:"
          du -ch assets/units/human_upgrades/{longbowman,marksman,greatswordsman,champion,pikeman,royal_guard,heavy_cavalry,lancer,mounted_archer,field_medic,field_chaplain,banner_captain,siege_engineer}.png | tail -1

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Import optimized Human promotion art"
          git push
