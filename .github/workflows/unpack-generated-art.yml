name: Unpack generated art

on:
  push:
    branches: [main]
    paths:
      - assets/cart_crown_assets_upload.zip
      - .github/workflows/unpack-generated-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack uploaded art
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assets/cart_crown_assets_upload.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No generated art ZIP present; nothing to unpack."
            exit 0
          fi

          rm -rf /tmp/cart-crown-generated
          mkdir -p /tmp/cart-crown-generated
          unzip -q "$ZIP" -d /tmp/cart-crown-generated

          test -d /tmp/cart-crown-generated/cart_crown_assets_upload/assets
          cp -a /tmp/cart-crown-generated/cart_crown_assets_upload/assets/. assets/

          rm -f "$ZIP"

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets; then
            echo "No asset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Unpack generated crest mission and unit art"
          git push
