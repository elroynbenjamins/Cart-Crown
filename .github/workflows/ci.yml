name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Balance regression
        run: npm run balance:check

      - name: Economy regression
        run: npm run economy:check

      - name: Save integrity regression
        run: npm run save:check

      - name: Mobile session regression
        run: npm run mobile:check
