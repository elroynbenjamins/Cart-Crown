name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Balance regression
        run: npm run balance:check

      - name: Economy regression
        run: npm run economy:check

      - name: Save integrity regression
        run: npm run save:check

      - name: Mobile session regression
        run: npm run mobile:check

      - name: Tutorial and review regression
        run: npm run tutorial:check

      - name: Kingdom Trials regression
        run: npm run trials:check

      - name: Kingdom Defense regression
        run: npm run defense:check

      - name: Expedition regression
        run: npm run expedition:check

      - name: War Table regression
        run: npm run war-table:check

      - name: Enemy fantasy regression
        run: npm run fantasy-enemy:check

      - name: Enemy fantasy presentation regression
        run: npm run fantasy-enemy-presentation:check

      - name: Cross-mode progression regression
        run: npm run cross-mode:check

      - name: Side-mode difficulty regression
        run: npm run side-mode-difficulty:check

      - name: Offensive Siege regression
        run: npm run siege:check

      - name: Relic Hunt regression
        run: npm run relic-hunt:check

      - name: Activities hub regression
        run: npm run activity-hub:check

      - name: Army Loadout regression
        run: npm run army-loadout:check

      - name: Decision UI regression
        run: npm run decision-ui:check

      - name: Equipment emphasis regression
        run: npx --no-install tsx scripts/equipment-emphasis-regression.ts

      - name: Research UI regression
        run: npx --no-install tsx scripts/research-ui-regression.ts

      - name: Settlement UI regression
        run: npx --no-install tsx scripts/settlement-ui-regression.ts

      - name: Kingdom building UI regression
        run: npx --no-install tsx scripts/kingdom-building-ui-regression.ts

      - name: Policy UI regression
        run: npx --no-install tsx scripts/policy-ui-regression.ts

      - name: Campaign event UI regression
        run: npx --no-install tsx scripts/campaign-event-ui-regression.ts

      - name: Early faction event UI regression
        run: npx --no-install tsx scripts/faction-event-ui-regression.ts

      - name: Late faction event UI regression
        run: npx --no-install tsx scripts/late-faction-event-ui-regression.ts

      - name: Late Human event UI regression
        run: npx --no-install tsx scripts/late-human-event-ui-regression.ts

      - name: Opening Human event UI regression
        run: npx --no-install tsx scripts/early-human-event-ui-regression.ts

      - name: Three Seals UI regression
        run: npx --no-install tsx scripts/meta-campaign-ui-regression.ts

      - name: Reinforcement muster UI regression
        run: npx --no-install tsx scripts/reinforcement-muster-ui-regression.ts

      - name: Production art regression
        run: npm run art:check

      - name: Boss presentation regression
        run: npm run boss:check

      - name: Exchange VFX regression
        run: npm run battle-visuals:check

      - name: Neutral dark theme regression
        run: npx --no-install tsx scripts/dark-theme-regression.ts
