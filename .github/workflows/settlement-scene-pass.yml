name: Settlement scene refinement
on:
  push:
    branches: [settlement-scene-confirmations-20261005]
    paths:
      - '.github/workflows/settlement-scene-pass.yml'
      - 'scripts/apply-settlement-scene-pass.py'
permissions:
  contents: write
concurrency:
  group: settlement-scene-refinement
  cancel-in-progress: false
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settlement-scene-confirmations-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply baseline-checked changes
        run: |
          python3 scripts/apply-settlement-scene-pass.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/screens/SettlementScreen.tsx')
          s = p.read_text().replace('...StyleSheet.absoluteFillObject', "position: 'absolute', left: 0, right: 0, top: 0, bottom: 0")
          s = s.replace('  const renderedInteractionVersion = interactionVersion.current;', '''  const latestInteractionRender = useRef<object | null>(null);
            const interactionRender = {};
            latestInteractionRender.current = interactionRender;
            const renderedInteractionVersion = interactionVersion.current;''')
          s = s.replace('if (interactionVersion.current !== renderedInteractionVersion ||', 'if (latestInteractionRender.current !== interactionRender || interactionVersion.current !== renderedInteractionVersion ||')
          s = s.replace(": selectedBuildingLevel >= selectedBuilding.maxLevel ? 'Maximum building level reached.'", ": selectedBuildingLevel <= 0 ? 'Construct this building first.'\n    : selectedBuildingLevel >= selectedBuilding.maxLevel ? 'Maximum building level reached.'")
          p.write_text(s)
          p = Path('scripts/settlement-ui-regression.ts')
          t = p.read_text().replace("nodes(tree, 'View').some(node => node.props.testID === 'scene-building-feedback')", "nodes(tree, 'Text').some(node => node.props.testID === 'scene-building-feedback')")
          p.write_text(t)
          PY
      - name: Install project dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Typecheck
        run: npm run typecheck
      - name: Settlement interaction regression
        run: npx tsx scripts/settlement-ui-regression.ts
      - name: Kingdom building regression
        run: npx tsx scripts/kingdom-building-ui-regression.ts
      - name: Tutorial regression
        run: npm run tutorial:check
      - name: Save integrity regression
        run: npm run save:check
      - name: Publish verified source changes to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/SettlementScreen.tsx src/ui/settlementActionLayout.ts scripts/settlement-ui-regression.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Keep settlement actions and safe confirmations on the scene'
          git push origin HEAD:refs/heads/settlement-scene-confirmations-20261005
